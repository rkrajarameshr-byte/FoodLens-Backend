spring.application.name=foodlens-backend
server.port=8080
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/foodlens}
spring.datasource.username=${DB_USER:foodlens}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
foodlens.jwt.secret=${JWT_SECRET}
foodlens.jwt.expiration-ms=86400000
foodlens.ai-service-url=${AI_SERVICE_URL:http://localhost:8000}
